<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Express - Rider</title>
<style>
  :root{--g:#0b7a43;--g2:#12b76a;--dark:#0f1f17;--gold:#ffc83d;--bg:#f3f7f4}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
  body{background:var(--bg);color:#1c2b22;padding-bottom:40px}
  header{background:var(--dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header b span{color:var(--gold)}
  .wrap{max-width:640px;margin:auto;padding:14px}
  .box{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px #0b7a4314}
  input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #cfdcd3;border-radius:10px;font-size:15px}
  .btn{display:inline-block;text-decoration:none;border:none;cursor:pointer;font-size:15px;font-weight:bold;padding:11px 18px;border-radius:26px;margin:4px 4px 0 0;background:var(--g);color:#fff}
  .btn.gold{background:var(--gold);color:#222} .btn.red{background:#c62828} .btn.wa{background:#25d366}
  .code{font-size:22px;font-weight:bold;color:var(--g)}
  .tag{display:inline-block;padding:3px 10px;border-radius:14px;font-size:13px;font-weight:bold;background:#fff3cd}
  .tag.onway{background:#d9f2e3;color:var(--g)}
  pre{white-space:pre-wrap;font-family:inherit;background:#f3f7f4;border-radius:10px;padding:10px;margin:8px 0}
  small{color:#667} .ok{color:var(--g);font-weight:bold}
  #app{display:none}
</style>
</head>
<body>
<header><b>Campus<span>Express</span> · Rider</b><span id="who"></span></header>

<div class="wrap">
  <div class="box" id="login">
    <h3>Rider login</h3>
    <input id="rid" placeholder="Your rider name (letters/numbers, e.g. john1)">
    <input id="rpin" type="password" placeholder="Rider PIN">
    <button class="btn" onclick="enter()">Start</button>
    <p id="lmsg" style="color:#c62828;margin-top:6px"></p>
  </div>

  <div id="app">
    <div class="box">
      <b>📍 My live location</b><br>
      <small>Customers see where you are while you deliver. Keep this page open and your screen on.</small><br>
      <button class="btn" id="shareBtn" onclick="toggleShare()">Start sharing location</button>
      <span id="shareInfo"></span>
    </div>
    <h3 style="margin:14px 0 8px">Orders</h3>
    <div id="list"><small>Loading orders...</small></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== CHANGE THESE ===== */
const RIDER_PIN = "1234";   // change this. It is only light protection (see notes)
const firebaseConfig = {    // same three values as in index.html
  apiKey: "AIzaSyDKSQnn_88v4wrSHfTBAhkQaGcGfg3j1l8",
  authDomain: "campus-express-30319.firebaseapp.com",
  databaseURL: "https://campus-express-30319-default-rtdb.firebaseio.com",
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let fdb = null, rider = "", watchId = null;
try{ if (!firebaseConfig.databaseURL.includes("PASTE")){ firebase.initializeApp(firebaseConfig); fdb = firebase.database(); } }catch(e){}

function enter(){
  const id = $("rid").value.toLowerCase().replace(/[^a-z0-9]/g,"");
  if (!fdb) return $("lmsg").textContent = "Firebase is not set up yet. Paste your Firebase details in this file.";
  if (!id || $("rpin").value !== RIDER_PIN) return $("lmsg").textContent = "Wrong rider name or PIN.";
  rider = id; localStorage.setItem("ce_rider", id);
  $("login").style.display = "none"; $("app").style.display = "block"; $("who").textContent = id;
  fdb.ref("queue").on("value", s => load(s.val() || {}));
}
if (localStorage.getItem("ce_rider")) $("rid").value = localStorage.getItem("ce_rider");

function toggleShare(){
  if (watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null;
    $("shareBtn").textContent = "Start sharing location"; $("shareInfo").textContent = ""; return; }
  if (!navigator.geolocation) return alert("This phone cannot share location.");
  watchId = navigator.geolocation.watchPosition(p => {
    fdb.ref("riders/"+rider).set({lat:p.coords.latitude, lng:p.coords.longitude, t:Date.now()});
    $("shareInfo").innerHTML = '<span class="ok">✅ Sharing</span>';
  }, () => { $("shareInfo").textContent = "Could not get location. Turn on GPS and allow it."; },
  {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  $("shareBtn").textContent = "Stop sharing location";
}

async function load(queue){
  const dayAgo = Date.now() - 24*3600*1000;
  const codes = Object.keys(queue).filter(c => queue[c].s !== "delivered" && queue[c].t > dayAgo)
                       .sort((a,b) => queue[a].t - queue[b].t);
  if (!codes.length){ $("list").innerHTML = "<small>No open orders right now.</small>"; return; }
  const orders = await Promise.all(codes.map(c => fdb.ref("orders/"+c).once("value").then(s => [c, s.val()])));
  $("list").innerHTML = orders.filter(o => o[1]).map(([c,o]) => {
    const phone = String(o.phone||"").replace(/[^0-9]/g,"");
    const wa = phone.startsWith("0") ? "254"+phone.slice(1) : phone;
    const mine = o.rider === rider;
    let acts = "";
    if (o.status === "waiting"){
      acts = '<select id="eta_'+c+'"><option value="10">Arrive in 10 min</option><option value="15">15 min</option>' +
             '<option value="20" selected>20 min</option><option value="30">30 min</option><option value="45">45 min</option></select>' +
             '<button class="btn gold" onclick="take(\''+c+'\')">Take this order</button>';
    } else if (mine){
      acts = '<select id="eta_'+c+'"><option value="5">Update: 5 min left</option><option value="10">10 min left</option>' +
             '<option value="15">15 min left</option><option value="20">20 min left</option></select>' +
             '<button class="btn" onclick="setEta(\''+c+'\')">Update time</button>' +
             '<button class="btn red" onclick="done(\''+c+'\')">Delivered ✅</button>';
    } else acts = "<small>Taken by " + esc(o.rider) + "</small>";
    return '<div class="box"><span class="code">'+c+'</span> <span class="tag '+(o.status==="onway"?"onway":"")+'">'+
      (o.status==="onway" ? "On the way" : "Waiting") + '</span>' +
      '<p><b>'+esc(o.name)+'</b> · KES '+esc(o.price)+'</p><small>'+esc(o.pay)+'</small>' +
      '<pre>'+esc(o.list)+'</pre>' +
      '<p>From: <b>'+esc(o.from)+'</b><br>To: <b>'+esc(o.to)+'</b></p>' +
      '<a class="btn" href="tel:+'+wa+'">📞 Call</a><a class="btn wa" target="_blank" href="https://wa.me/'+wa+'">WhatsApp</a>' +
      (Number(o.lat) ? '<a class="btn gold" target="_blank" href="https://maps.google.com/?q='+Number(o.lat)+','+Number(o.lng)+'">📍 Customer location</a>' : '') +
      '<div style="margin-top:8px">'+acts+'</div></div>';
  }).join("");
}

function minutes(c){ return Number($("eta_"+c).value) || 15; }
function take(c){
  fdb.ref("orders/"+c).update({status:"onway", rider:rider, etaAt:Date.now()+minutes(c)*60000});
  fdb.ref("queue/"+c).update({s:"onway"});
  if (watchId === null) toggleShare();
}
function setEta(c){ fdb.ref("orders/"+c).update({etaAt:Date.now()+minutes(c)*60000}); }
function done(c){
  if (!confirm("Mark order " + c + " as delivered?")) return;
  fdb.ref("orders/"+c).update({status:"delivered"});
  fdb.ref("queue/"+c).update({s:"delivered"});
}
</script>
</body>
</html>
